<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhonePick — Smart Recommender</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: rgba(255,255,255,0.07);
      --accent: #c8ff57;
      --accent2: #57d4ff;
      --text: #f0f0f5;
      --muted: #7070a0;
      --radius: 20px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      padding: 48px 24px 32px;
      text-align: center;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(200,255,87,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo-text span { color: var(--accent); }
    header p {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 0 16px 20px;
      padding: 24px 20px;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── BUDGET INPUT ── */
    .budget-wrap {
      position: relative;
    }
    .currency-badge {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }
    input[type="number"] {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 16px 16px 42px;
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: var(--accent); }
    input[type="number"]::placeholder { color: var(--muted); font-size: 18px; }

    /* ── RANGE SLIDER ── */
    .range-labels {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted);
      margin-top: 10px;
    }
    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(to right, var(--accent) 0%, var(--surface2) 0%);
      margin-top: 6px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(200,255,87,0.2);
      cursor: pointer;
    }

    /* ── USAGE PILLS ── */
    .usage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .pill {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .pill .pill-icon { font-size: 22px; margin-bottom: 6px; }
    .pill .pill-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.2s;
    }
    .pill.active {
      background: rgba(200,255,87,0.08);
      border-color: var(--accent);
    }
    .pill.active .pill-label { color: var(--accent); }
    .pill:active { transform: scale(0.95); }

    /* ── BUTTON ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: calc(100% - 32px);
      margin: 0 16px 20px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
      border: none;
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
      box-shadow: 0 8px 30px rgba(200,255,87,0.2);
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn svg { flex-shrink: 0; }

    /* ── RESULT ── */
    #result { display: none; margin: 0 16px; }
    #result.visible { display: block; animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .result-badge {
      background: rgba(87,212,255,0.1);
      border: 1px solid rgba(87,212,255,0.25);
      color: var(--accent2);
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 8px;
    }

    .phone-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .phone-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .phone-card:first-of-type::before { opacity: 1; }

    .phone-emoji {
      font-size: 36px;
      flex-shrink: 0;
      width: 56px; height: 56px;
      background: var(--surface2);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .phone-info { flex: 1; }
    .phone-rank {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .phone-name {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .phone-price {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .phone-desc {
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }
    .phone-tags {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 10px;
    }
    .tag {
      background: var(--surface2);
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 48px 0 32px;
      color: var(--muted);
    }
    .empty-state .big-icon { font-size: 52px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    /* ── FOOTER NOTE ── */
    .footnote {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 24px;
      padding: 0 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">📱</div>
    <div class="logo-text">Phone<span>Pick</span></div>
  </div>
  <p>Find your perfect smartphone match</p>
</header>

<!-- BUDGET CARD -->
<div class="card">
  <div class="section-label">Your Budget</div>
  <div class="budget-wrap">
    <span class="currency-badge">₹</span>
    <input type="number" id="budgetInput" placeholder="e.g. 25000" min="5000" max="200000" />
  </div>
  <input type="range" id="budgetSlider" min="5000" max="200000" step="1000" value="25000" />
  <div class="range-labels">
    <span>₹5K</span>
    <span id="sliderDisplay">₹25,000</span>
    <span>₹2L</span>
  </div>
</div>

<!-- USAGE CARD -->
<div class="card">
  <div class="section-label">Primary Usage</div>
  <div class="usage-grid" id="usageGrid">
    <div class="pill" data-value="Gaming">
      <div class="pill-icon">🎮</div>
      <div class="pill-label">Gaming</div>
    </div>
    <div class="pill" data-value="Camera">
      <div class="pill-icon">📸</div>
      <div class="pill-label">Camera</div>
    </div>
    <div class="pill" data-value="Battery">
      <div class="pill-icon">🔋</div>
      <div class="pill-label">Battery</div>
    </div>
    <div class="pill" data-value="Storage">
      <div class="pill-icon">💾</div>
      <div class="pill-label">Storage</div>
    </div>
    <div class="pill" data-value="Pixels">
      <div class="pill-icon">🖥️</div>
      <div class="pill-label">Display</div>
    </div>
    <div class="pill" data-value="Charging">
      <div class="pill-icon">⚡</div>
      <div class="pill-label">Charging</div>
    </div>
  </div>
</div>

<!-- CTA BUTTON -->
<button class="btn" onclick="getRecommendation()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
  </svg>
  Get Recommendation
</button>

<!-- RESULT SECTION -->
<div id="result"></div>

<script>
  const phoneDB = {
    Gaming: [
      { name: "ASUS ROG Phone 8", price: [79999, 200000], emoji: "🕹️", desc: "Snapdragon 8 Gen 3, 165Hz AMOLED, AeroActive Cooler, 6000mAh beast — the undisputed gaming champion.", tags: ["165Hz", "SD 8 Gen 3", "AirTriggers", "6000mAh"] },
      { name: "Poco F6 Pro", price: [29999, 80000], emoji: "🎯", desc: "Snapdragon 8s Gen 3, 120Hz AMOLED, LiquidCool 4.0. Gaming firepower without the luxury tax.", tags: ["120Hz", "SD 8s Gen 3", "LiquidCool", "67W"] },
      { name: "Poco F6", price: [19999, 30000], emoji: "🃏", desc: "Snapdragon 8s Gen 3 at a mid-range price. Unmatched performance-per-rupee for serious gamers.", tags: ["120Hz", "SD 8s Gen 3", "5000mAh", "67W"] },
      { name: "Redmi Note 13 Pro+", price: [5000, 20000], emoji: "🎲", desc: "Dimensity 7200 Ultra, smooth gaming on a budget. A solid starter gaming pick.", tags: ["120Hz", "Dimensity 7200U", "5000mAh", "120W"] },
    ],
    Camera: [
      { name: "Google Pixel 9 Pro", price: [99999, 200000], emoji: "🌟", desc: "Best-in-class computational photography, Magic Eraser, Best Take. Android's camera king.", tags: ["50MP", "AI Camera", "Night Sight", "8K Video"] },
      { name: "Samsung Galaxy S24+", price: [69999, 100000], emoji: "🔭", desc: "ProVisual Engine, 50MP main + 10x optical zoom, AI editing suite — stunning versatility.", tags: ["200MP", "10x Zoom", "8K", "AI Edit"] },
      { name: "Vivo V30 Pro", price: [35999, 70000], emoji: "🎞️", desc: "ZEISS co-engineered optics, aura light portrait system — a true camera-first mid-ranger.", tags: ["ZEISS", "50MP", "Aura Light", "4K"] },
      { name: "Redmi Note 13 Pro", price: [5000, 36000], emoji: "📷", desc: "200MP OIS camera at a budget price. Crazy good stills for the money.", tags: ["200MP OIS", "120Hz", "5000mAh", "67W"] },
    ],
    Battery: [
      { name: "Infinix GT 20 Pro", price: [20000, 35000], emoji: "🔋", desc: "5000mAh + AI Battery Management, 68W. Long-hauler for heavy usage days.", tags: ["5000mAh", "68W", "AI Battery", "AMOLED"] },
      { name: "Moto G85", price: [16999, 22000], emoji: "🏕️", desc: "5000mAh, near-stock Android, reliable all-day battery life. Simple and effective.", tags: ["5000mAh", "33W", "pOLED", "Stock Android"] },
      { name: "Samsung Galaxy M15 5G", price: [5000, 17000], emoji: "🌐", desc: "6000mAh massive battery, 5G connectivity, budget-friendly longevity pick.", tags: ["6000mAh", "25W", "5G", "AMOLED"] },
      { name: "Realme Narzo 70 Pro", price: [18000, 30000], emoji: "⚡", desc: "5000mAh + 45W fast charge + AMOLED. Great balance of endurance and style.", tags: ["5000mAh", "45W", "AMOLED", "SD 6 Gen 1"] },
    ],
    Storage: [
      { name: "Samsung Galaxy S24 Ultra", price: [129999, 200000], emoji: "🗄️", desc: "Up to 1TB UFS 4.0 storage, S Pen, 12GB RAM. The ultimate storage powerhouse.", tags: ["1TB", "UFS 4.0", "12GB RAM", "S Pen"] },
      { name: "OnePlus 12R", price: [39999, 80000], emoji: "💿", desc: "256GB + 16GB RAM, UFS 3.1 fast storage. Power user's pick for speed & space.", tags: ["256GB", "16GB RAM", "UFS 3.1", "100W"] },
      { name: "Poco X6 Pro", price: [22999, 40000], emoji: "🧠", desc: "Up to 512GB, UFS 4.0 storage — blazing fast read/write at a mid-range price.", tags: ["512GB", "UFS 4.0", "12GB RAM", "67W"] },
      { name: "Redmi 13C", price: [5000, 13000], emoji: "📦", desc: "128GB internal + microSD expansion. Affordable storage starter.", tags: ["128GB", "microSD", "5000mAh", "18W"] },
    ],
    Pixels: [
      { name: "Samsung Galaxy Z Fold 6", price: [164999, 200000], emoji: "🖥️", desc: "7.6-inch Foldable AMOLED, 2176×1812 resolution — literally the biggest phone screen you can buy.", tags: ["7.6\" Fold", "2K+", "AMOLED", "SD 8 Gen 3"] },
      { name: "OnePlus 12", price: [64999, 130000], emoji: "🌈", desc: "2K LTPO AMOLED, 4500 nits peak brightness, 1–120Hz ProXDR. Dazzling display.", tags: ["2K AMOLED", "4500 nits", "120Hz", "ProXDR"] },
      { name: "iQOO Neo 9 Pro", price: [34999, 65000], emoji: "💎", desc: "1.5K AMOLED, 144Hz, flagship display at a sub-flagship price.", tags: ["1.5K AMOLED", "144Hz", "2160Hz PWM", "SD 8 Gen 2"] },
      { name: "Motorola Edge 50 Fusion", price: [17999, 35000], emoji: "🎨", desc: "pOLED 144Hz, vibrant colours, 1080p+ resolution on a budget.", tags: ["pOLED", "144Hz", "1080p+", "68W"] },
    ],
    Charging: [
      { name: "Xiaomi 14 Ultra", price: [99999, 200000], emoji: "🚀", desc: "90W wired + 80W wireless + 10W reverse. Charges to 100% in under 30 minutes.", tags: ["90W Wired", "80W Wireless", "Reverse Charge", "Leica"] },
      { name: "iQOO 12", price: [52999, 100000], emoji: "⚡", desc: "120W FlashCharge — 0 to 100% in ~22 minutes. The fastest charging flagship.", tags: ["120W", "0-100 in 22m", "SD 8 Gen 3", "144Hz"] },
      { name: "Realme GT 6T", price: [29999, 53000], emoji: "🔌", desc: "120W SUPERVOOC — screaming fast charging with a mid-range price tag.", tags: ["120W", "SD 7+ Gen 3", "5500mAh", "AMOLED"] },
      { name: "Redmi Note 13 Pro+", price: [5000, 36000], emoji: "💥", desc: "120W HyperCharge — fastest in the segment by far. Fully charged in ~19 minutes.", tags: ["120W", "5000mAh", "200MP", "AMOLED"] },
    ],
  };

  // Sync slider ↔ input
  const slider = document.getElementById('budgetSlider');
  const input = document.getElementById('budgetInput');
  const display = document.getElementById('sliderDisplay');

  function fmt(v) { return '₹' + Number(v).toLocaleString('en-IN'); }

  function updateSliderFill(val) {
    const min = +slider.min, max = +slider.max;
    const pct = ((val - min) / (max - min)) * 100;
    slider.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--surface2) ${pct}%)`;
    display.textContent = fmt(val);
  }

  slider.addEventListener('input', () => {
    input.value = slider.value;
    updateSliderFill(slider.value);
  });
  input.addEventListener('input', () => {
    const v = Math.min(Math.max(+input.value || 5000, 5000), 200000);
    slider.value = v;
    updateSliderFill(v);
  });
  updateSliderFill(25000);

  // Pill selection
  let selectedUsage = null;
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      selectedUsage = p.dataset.value;
    });
  });

  function getRecommendation() {
    const budget = +input.value;
    const result = document.getElementById('result');

    if (!budget || budget < 5000) {
      showError('Please enter a budget of at least ₹5,000.');
      return;
    }
    if (!selectedUsage) {
      showError('Please select a primary usage from the options above.');
      return;
    }

    const phones = phoneDB[selectedUsage].filter(p => budget >= p.price[0] && budget <= p.price[1]);

    if (phones.length === 0) {
      result.innerHTML = `
        <div class="empty-state">
          <div class="big-icon">🔍</div>
          <p>No phones found for <strong style="color:var(--text)">${selectedUsage}</strong><br>under <strong style="color:var(--accent)">${fmt(budget)}</strong>.<br>Try increasing your budget.</p>
        </div>`;
      result.className = 'visible';
      result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }

    const ranks = ['🥇 Top Pick', '🥈 Runner Up', '🥉 Also Consider'];
    const cards = phones.map((p, i) => `
      <div class="phone-card">
        <div class="phone-emoji">${p.emoji}</div>
        <div class="phone-info">
          <div class="phone-rank">${ranks[i] || `#${i+1} Option`}</div>
          <div class="phone-name">${p.name}</div>
          <div class="phone-price">${fmt(p.price[0])} – ${fmt(p.price[1])}</div>
          <div class="phone-desc">${p.desc}</div>
          <div class="phone-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </div>`).join('');

    result.innerHTML = `
      <div class="result-header">
        <span class="result-badge">✦ AI Picks</span>
        <span style="font-size:12px;color:var(--muted)">${phones.length} match${phones.length > 1 ? 'es' : ''} for ${selectedUsage}</span>
      </div>
      ${cards}
      <p class="footnote">Prices are approximate market ranges. Always check latest prices on Amazon, Flipkart, or official sites.</p>
    `;
    result.className = 'visible';
    setTimeout(() => result.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }

  function showError(msg) {
    const result = document.getElementById('result');
    result.innerHTML = `<div class="card" style="border-color:rgba(255,80,80,0.3);background:rgba(255,40,40,0.05)">
      <p style="font-size:13px;color:#ff8080;text-align:center">⚠️ ${msg}</p>
    </div>`;
    result.className = 'visible';
  }
</script>
</body>
</html>
